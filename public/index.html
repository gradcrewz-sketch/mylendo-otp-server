function dist(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

return same(d,n)?"Today":same(d,y)?"Yesterday":d.toLocaleDateString([],{day:"numeric",month:"long",year:"numeric"})}
function waList(t){const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return waTime(t);const y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);return d.toDateString()===y.toDateString()?"Yesterday":d.toLocaleDateString([],{day:"2-digit",month:"2-digit",year:"2-digit"})}

/* ---------- AI assistant ---------- */
function aiReply(q){const s=q.toLowerCase();
const hit=db.items.filter(i=>i.qty>0&&s.split(/\W+/).some(w=>w.length>3&&(i.title+" "+i.cat+" "+i.desc).toLowerCase().includes(w)));
if(/otp/.test(s))return"When you pay, a 4-digit OTP is generated for you. Give it to the lender or seller at pickup. They enter it to confirm the handover.";
if(/deposit|assurance|25|refund|lost|return/.test(s))return"Rentals work with an assurance equal to the item value. The lender gets 25% when you receive the item. If you return it, the rest is refunded to you. If it is lost, the lender keeps 100%.";
if(/wish/.test(s))return"Wishing an item sends an alert to every MYLENDO user, so lenders learn what is in demand.";
if(/safe|verify|college id|face/.test(s))return"Every user is verified with name, college, phone, email, college ID, Face ID and a captcha. Details are stored under the terms you accepted.";
if(hit.length){const L=loc();return"I found: "+hit.slice(0,3).map(i=>{const oc=col(user(i.owner).college);return i.title+" (₹"+i.price+", "+i.mode+", "+dist(L.la,L.lo,oc.la,oc.lo).toFixed(1)+" km)"}).join("; ")+". Open Browse to request one."}
return"Try asking for an item (for example “calculator”), or ask how OTP, assurance, refunds or verification work."}
/* The AI tab talks to the MYLENDO AI server (server.js, POST /chat). If the server cannot be reached, it falls back to the built-in helper above.
   If your server runs somewhere else, change CHAT_API to its address, for example "https://api.yourdomain.com". */
const CHAT_API=API_BASE;
let aiBusy=0;
async function chatServer(t){let r;try{r=await fetch(CHAT_API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t}),signal:AbortSignal.timeout(30000)})}catch(e){
if(e&&e.name==="TimeoutError")return{why:"The AI took too long to answer (over 30 seconds)."};
if(location.protocol==="https:"&&CHAT_API.indexOf("http:")===0)return{why:"This site is on https but the AI server address ("+CHAT_API+") is http, so the browser blocks it. Use an https address for the server."};
return{why:"Cannot reach the AI server at "+CHAT_API+". Check that server.js is running and that this address is right."}}
let j=null;try{j=await r.json()}catch(e){}
if(r.ok&&j&&j.reply)return{r:String(j.reply)};
return{why:"The server answered with an error ("+r.status+"). Look at the server window for the line starting “AI Error”. It is usually the API key, the model name or the usage limit."}}
